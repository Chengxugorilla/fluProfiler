# Configuration for reverse testing experiment
# Test season: 2024NH
# Model: fluProfiler_v0_1

experiment:
  name: "reverse_test_2024NH_model4"
  type: "reverse_test"
  description: "Reverse chronological testing for 2024 Northern Hemisphere season"

data:
  test_season: "2024NH"
  train_seasons: ["2010NH", "2011NH", "2012NH", "2013NH", "2014NH", "2015NH",
                  "2016NH", "2017NH", "2018NH", "2019NH", "2020NH", "2021NH",
                  "2022NH", "2023NH"]

model:
  name: "fluProfiler_v0_1"
  checkpoint: "checkpoints/model4_2024NH.pth"

evaluation:
  metrics: ["mae", "mse", "pearson", "spearman", "r2"]
  bootstrap_iterations: 1000
  save_predictions: true
  output_dir: "results/reverse_test/2024NH/model4/"